<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyStudyDeck</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0a; color: #e5e5e5; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .container { max-width: 480px; padding: 48px 24px; text-align: center; }
    h1 { font-size: 2rem; font-weight: 700; margin-bottom: 12px; color: #fff; }
    .tagline { font-size: 1.1rem; color: #a3a3a3; margin-bottom: 32px; }
    .badge { display: inline-block; margin-bottom: 32px; }
    .badge img { height: 54px; }
    .links { display: flex; gap: 24px; justify-content: center; margin-top: 16px; }
    .links a { color: #818cf8; text-decoration: none; font-size: 0.9rem; }
    .links a:hover { text-decoration: underline; }
    .contact { margin-top: 32px; font-size: 0.85rem; color: #737373; }
    .contact a { color: #818cf8; text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>MyStudyDeck</h1>
    <p class="tagline">Snap. Learn. Export to Anki.</p>
    <div class="links">
      <a href="/privacy">Privacy Policy</a>
      <a href="/terms">Terms of Service</a>
    </div>
    <div class="contact">
      <p>Questions? <a href="mailto:support@mystudydeck.store">support@mystudydeck.store</a></p>
    </div>
  </div>
</body>
</html>
